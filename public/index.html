<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Codes</title>
  <meta name="description" content="Tra cứu mã ngôn ngữ (ISO 639 / BCP 47) với tên dịch sang 8 ngôn ngữ.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c2410c'/><text x='16' y='22' font-family='monospace' font-size='15' font-weight='700' text-anchor='middle' fill='white'>Aa</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">Aa</span>
        <div>
          <h1 data-i18n="title"></h1>
          <p class="sub" data-i18n="subtitle"></p>
        </div>
      </div>
      <div class="controls">
        <label class="sr-only" for="ui-lang" data-i18n="displayLanguage"></label>
        <select id="ui-lang" class="select"></select>
        <button id="theme" class="icon-btn" type="button" aria-label="Theme">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="search-block">
      <div class="search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder">
        <kbd>/</kbd>
      </div>
      <div class="toolbar">
        <div class="chips" id="filters" role="tablist"></div>
        <div class="toolbar-right">
          <span id="count" class="count"></span>
          <select id="sort" class="select small"></select>
        </div>
      </div>
    </section>

    <section class="list-head" aria-hidden="true">
      <span data-i18n="colCode"></span>
      <span data-i18n="colName"></span>
      <span data-i18n="colNative"></span>
      <span data-i18n="colEnglish"></span>
    </section>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <footer class="wrap foot">
    <span data-i18n="footer"></span>
  </footer>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="d-title">
      <button class="icon-btn close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="drawer-body"></div>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
